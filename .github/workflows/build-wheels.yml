name: Build and publish wheels

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: false
        default: "Manual testing"
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_linux:
    name: Build Linux wheels (${{ matrix.label }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: manylinux2014_x86_64
            artifact_name: wheel-linux-manylinux2014_x86_64
            manylinux_image: manylinux2014
            environment_linux: >-
              FC=gfortran
              CC=gcc
              PIP_PREFER_BINARY=1
            test_skip: "cp314-manylinux_x86_64"
            build_selector: >-
              cp39-manylinux_x86_64
              cp310-manylinux_x86_64
              cp311-manylinux_x86_64
              cp312-manylinux_x86_64
              cp313-manylinux_x86_64
              cp314-manylinux_x86_64
          - label: manylinux_2_28_x86_64
            artifact_name: wheel-linux-manylinux_2_28_x86_64
            manylinux_image: manylinux_2_28
            environment_linux: >-
              FC=gfortran
              CC=gcc
              PIP_PREFER_BINARY=1
              PIP_ONLY_BINARY=numpy,scipy
            test_skip: ""
            build_selector: >-
              cp39-manylinux_x86_64
              cp310-manylinux_x86_64
              cp311-manylinux_x86_64
              cp312-manylinux_x86_64
              cp313-manylinux_x86_64
              cp314-manylinux_x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build wheels (Linux)
        uses: pypa/cibuildwheel@v3.4.0
        with:
          output-dir: wheelhouse
        env:
          CIBW_BUILD: ${{ matrix.build_selector }}
          CIBW_SKIP: "*-win32 *-musllinux* *-i686"
          CIBW_TEST_SKIP: ${{ matrix.test_skip }}
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_image }}
          CIBW_BEFORE_BUILD_LINUX: |
            yum install -y gcc-gfortran || dnf install -y gcc-gfortran || echo 'gfortran install failed'
            python -m pip install meson ninja
          CIBW_ENVIRONMENT_LINUX: ${{ matrix.environment_linux }}
          CIBW_TEST_COMMAND: python -c "import kuoeliassen; from kuoeliassen import solve_ke; print('Import test passed')"
          CIBW_BUILD_VERBOSITY: 1

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ./wheelhouse/*.whl

  build_macos:
    name: Build macOS wheels (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64
            os: macos-15-intel
            deployment_target: "15.0"
            artifact_name: wheel-macos-x86_64
            build_selector: >-
              cp39-macosx_x86_64
              cp310-macosx_x86_64
              cp311-macosx_x86_64
              cp312-macosx_x86_64
              cp313-macosx_x86_64
              cp314-macosx_x86_64
          - label: arm64
            os: macos-14
            deployment_target: "14.0"
            artifact_name: wheel-macos-arm64
            build_selector: >-
              cp39-macosx_arm64
              cp310-macosx_arm64
              cp311-macosx_arm64
              cp312-macosx_arm64
              cp313-macosx_arm64
              cp314-macosx_arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup macOS Fortran compiler
        shell: bash
        run: |
          set -euxo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew list gcc >/dev/null 2>&1 || brew install gcc
          GCC_PREFIX="$(brew --prefix gcc)"
          GCC_BIN_DIR="${GCC_PREFIX}/bin"
          C_BIN="$(compgen -G "${GCC_BIN_DIR}/gcc-[0-9]*" | sort -V | tail -1)"
          CXX_BIN="$(compgen -G "${GCC_BIN_DIR}/g++-[0-9]*" | sort -V | tail -1)"
          F_BIN="$(compgen -G "${GCC_BIN_DIR}/gfortran-[0-9]*" | sort -V | tail -1)"
          test -n "${C_BIN}"
          test -n "${CXX_BIN}"
          test -n "${F_BIN}"
          echo "${GCC_BIN_DIR}" >> "$GITHUB_PATH"
          echo "MACOS_CC=${C_BIN}" >> "$GITHUB_ENV"
          echo "MACOS_CXX=${CXX_BIN}" >> "$GITHUB_ENV"
          echo "MACOS_FC=${F_BIN}" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }}" >> "$GITHUB_ENV"

      - name: Build wheels (macOS)
        uses: pypa/cibuildwheel@v3.4.0
        with:
          output-dir: wheelhouse
        env:
          CIBW_BUILD: ${{ matrix.build_selector }}
          CIBW_SKIP: "*-win32 *-musllinux*"
          CIBW_BEFORE_BUILD: python -m pip install meson ninja
          CIBW_ENVIRONMENT_MACOS: FC=${{ env.MACOS_FC }} CC=${{ env.MACOS_CC }} CXX=${{ env.MACOS_CXX }} MACOSX_DEPLOYMENT_TARGET=${{ env.MACOSX_DEPLOYMENT_TARGET }} PIP_PREFER_BINARY=1 PIP_ONLY_BINARY=numpy,scipy
          MACOSX_DEPLOYMENT_TARGET: ${{ env.MACOSX_DEPLOYMENT_TARGET }}
          CIBW_TEST_COMMAND: python -c "import kuoeliassen; from kuoeliassen import solve_ke; print('Import test passed')"
          CIBW_BUILD_VERBOSITY: 1

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ./wheelhouse/*.whl

  build_windows:
    name: Build Windows wheels
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Windows Fortran (msys2)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran

      - name: Add MinGW toolchain to PATH
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "${{ steps.msys2.outputs.msys2-location }}\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build wheels (Windows)
        uses: pypa/cibuildwheel@v3.4.0
        with:
          output-dir: wheelhouse
        env:
          CIBW_BUILD: >-
            cp39-win_amd64
            cp310-win_amd64
            cp311-win_amd64
            cp312-win_amd64
            cp313-win_amd64
            cp314-win_amd64
          CIBW_SKIP: "*-win32 *-musllinux*"
          CIBW_BEFORE_BUILD_WINDOWS: python -m pip install meson ninja delvewheel
          CIBW_ENVIRONMENT_WINDOWS: >-
            PATH="${{ steps.msys2.outputs.msys2-location }}\\mingw64\\bin;${{ steps.msys2.outputs.msys2-location }}\\usr\\bin;$PATH"
            CC=gcc
            FC=gfortran
            F77=gfortran
            F90=gfortran
            PIP_PREFER_BINARY=1
            PIP_ONLY_BINARY=numpy,scipy
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair
            --add-path ${{ steps.msys2.outputs.msys2-location }}\mingw64\bin
            -w {dest_dir}
            {wheel}
          CIBW_TEST_COMMAND: python -c "import kuoeliassen; from kuoeliassen import solve_ke; print('Import test passed')"
          CIBW_BUILD_VERBOSITY: 1

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheel-windows-x86_64
          path: ./wheelhouse/*.whl

  # Source distribution build disabled - binary wheels only (see comment below)
  # NOTE: Source distribution (sdist) is NOT built for this release workflow
  #       Only binary wheels are published to PyPI for security/licensing reasons
  #       Users can still install via: pip install kuoeliassen
  #
  # To build locally with source:
  #   python -m build --sdist
  #
  # Uncomment the build_sdist job below if you later want to publish source code
  #
  # build_sdist:
  #   name: Build source distribution
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v6
  #       with:
  #         submodules: recursive
  #
  #     - name: Setup Python
  #       uses: actions/setup-python@v6
  #       with:
  #         python-version: "3.11"
  #
  #     - name: Build sdist
  #       run: |
  #         python -m pip install --upgrade pip build
  #         python -m build --sdist
  #
  #     - name: Upload sdist
  #       uses: actions/upload-artifact@v6
  #       with:
  #         name: sdist
  #         path: dist/*.tar.gz

  # Publish to PyPI (only on tags or release)
  # NOTE: Only wheel distributions are published (sdist is skipped for binary-only release)
  publish:
    name: Publish to PyPI (wheels only)
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build_linux, build_macos, build_windows]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Use trusted publishing
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          path: dist-artifacts
          merge-multiple: true

      - name: Prepare dist directory (wheels only)
        run: |
          mkdir -p dist
          find dist-artifacts -name "*.whl" -exec cp {} dist/ \;
          echo "📦 Prepared wheels for PyPI:"
          ls -lh dist/
          echo ""
          echo "Total wheels: $(ls dist/*.whl | wc -l)"

      - name: Verify wheels
        run: |
          python -m pip install --upgrade pip twine
          python -m twine check dist/*.whl
          echo "✓ All wheels passed verification"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # Test installation (multi-platform validation)
  # Verifies that binary wheels can be installed on different platforms
  test_install:
    name: Test wheel installation on ${{ matrix.os }} Python ${{ matrix.python-version }}
    needs: [build_linux, build_macos, build_windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheels
        uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true

      - name: Install packaging library
        run: |
          python -m pip install --upgrade pip packaging

      - name: Install and test wheel
        shell: python
        run: |
          import os
          import glob
          import subprocess
          import sys
          from packaging import tags

          # Get Python version tag (e.g., cp312)
          py_ver = f"cp{sys.version_info.major}{sys.version_info.minor}"

          # Get all compatible platform tags for this system
          compatible_tags = list(tags.sys_tags())
          print(f"Python: {py_ver}")
          print(f"Platform tags (first 5): {[str(t) for t in compatible_tags[:5]]}")

          # Find all wheels
          wheels = glob.glob("wheels/*.whl")
          print(f"\nAvailable wheels ({len(wheels)}):")
          for w in wheels:
            print(f"  {os.path.basename(w)}")

          # Parse wheel filenames and find compatible ones
          from packaging.utils import parse_wheel_filename

          matching_wheels = []
          for wheel_path in wheels:
            try:
              name, version, build, wheel_tags = parse_wheel_filename(os.path.basename(wheel_path))
              # Check if any wheel tag is compatible with our system
              for wheel_tag in wheel_tags:
                if wheel_tag in compatible_tags:
                  matching_wheels.append(wheel_path)
                  print(f"\n[OK] Compatible wheel found: {os.path.basename(wheel_path)}")
                  print(f"  Matching tag: {wheel_tag}")
                  break
            except Exception as e:
              print(f"  [WARN] Could not parse {os.path.basename(wheel_path)}: {e}")

          if not matching_wheels:
            print(f"\n[ERROR] No compatible wheel found for {py_ver}")
            print(f"Available wheels: {[os.path.basename(w) for w in wheels]}")
            print(f"Compatible platform tags: {[str(t) for t in compatible_tags[:10]]}")
            sys.exit(1)

          wheel_file = matching_wheels[0]
          print(f"\n[INSTALL] Installing wheel: {os.path.basename(wheel_file)}")

          # Upgrade pip first
          subprocess.run([sys.executable, "-m", "pip", "install", "--upgrade", "pip"], check=True)

          # Install the wheel
          subprocess.run([sys.executable, "-m", "pip", "install", wheel_file], check=True)

          print("\n[TEST] Testing import...")
          import kuoeliassen
          from kuoeliassen import solve_ke
          from kuoeliassen.xarray_interface import solve_ke_xarray
          print(f"[SUCCESS] KuoEliassen {kuoeliassen.__version__} imported successfully")
