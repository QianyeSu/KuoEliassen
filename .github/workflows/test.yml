name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Linux setup
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran gcc g++ ninja-build
          echo "gfortran version:"
          gfortran --version

      # macOS setup
      - name: Install macOS dependencies and build tools
        if: runner.os == 'macOS'
        run: |
          set -e
          echo "Updating Homebrew..."
          brew update
          
          echo "Installing gcc and ninja..."
          brew install gcc ninja
          
          # Verify gfortran installation
          echo "Checking gfortran..."
          which gfortran || echo "gfortran not in PATH"
          gfortran --version || echo "gfortran --version failed"
          
          # Check Homebrew installation directory
          BREW_PREFIX=$(brew --prefix)
          echo "Homebrew prefix: $BREW_PREFIX"
          ls -l "$BREW_PREFIX/bin/" | grep gfortran || echo "No gfortran in brew bin"
          
          # Create symlink if versioned
          GFORT_VERSIONED=$(ls "$BREW_PREFIX/bin/gfortran"-* 2>/dev/null | head -1)
          if [ -n "$GFORT_VERSIONED" ]; then
            echo "Found versioned gfortran: $GFORT_VERSIONED"
            sudo ln -sf "$GFORT_VERSIONED" /usr/local/bin/gfortran
          fi
          
          # Final verification
          echo "Final gfortran verification:"
          which gfortran
          gfortran --version

      # Windows setup
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          choco install -y msys2
          C:\tools\msys64\usr\bin\bash -lc "pacman -Sy --noconfirm mingw-w64-x86_64-gcc-fortran"
          echo "C:\tools\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set Windows compiler environment
        if: runner.os == 'Windows'
        run: |
          echo "CC=gcc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "FC=gfortran" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set macOS compiler environment
        if: runner.os == 'macOS'
        run: |
          echo "CC=gcc" >> $GITHUB_ENV
          echo "FC=gfortran" >> $GITHUB_ENV
          echo "LDFLAGS=-L/usr/local/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I/usr/local/include" >> $GITHUB_ENV

      - name: Install Python build backend and build tools (pre-install before isolation build)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "meson-python>=0.15.0" meson ninja numpy
          echo "Verifying installations:"
          python -m pip show meson-python meson ninja

      - name: Install Python dependencies
        run: |
          pip install scipy xarray pytest pytest-cov

      - name: Build and install package
        run: |
          pip install -e . --no-build-isolation

      - name: Run tests
        run: |
          pytest tests/ -v --cov=kuoeliassen --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: kuoeliassen-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
