name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Conda with gcc-gfortran
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: true
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: true

      - name: Install build dependencies via conda
        shell: bash -l {0}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # macOS: Use gfortran and clang from conda-forge
            conda install -y -c conda-forge gfortran cmake ninja meson make
          else
            # Linux and Windows: Use gcc, gfortran, g++
            conda install -y -c conda-forge gcc gfortran gxx cmake ninja meson make
          fi
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "meson-python>=0.15.0" numpy scipy xarray pytest pytest-cov coverage[toml]
          if [ "$RUNNER_OS" = "Windows" ]; then pip install delvewheel; fi

      - name: Verify compiler environment
        shell: bash -l {0}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # macOS: use clang for C/C++, gfortran for Fortran
            echo "macOS detected - using system clang + conda gfortran"
            clang --version | head -1
            gfortran --version | head -1
            export CC=clang
            export CXX=clang++
            export FC=gfortran
          else
            # Linux and Windows: use gcc toolchain
            gcc --version | head -1
            gfortran --version | head -1
            g++ --version | head -1
            export CC=gcc
            export CXX=g++
            export FC=gfortran
          fi
          echo "Compilers: CC=$CC, FC=$FC, CXX=$CXX"
          meson --version

      - name: Build and install package
        shell: bash -l {0}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export CC=clang
            export CXX=clang++
            export FC=gfortran
          else
            export CC=gcc
            export CXX=g++
            export FC=gfortran
          fi
          export F77=gfortran
          export F90=gfortran
          export FFLAGS="-O3 -fPIC -fopenmp -fno-second-underscore -std=legacy"
          export CFLAGS="-O3 -fPIC -fopenmp"
          export LDFLAGS="-fopenmp"
          pip install -e . --no-build-isolation -v

      - name: Verify installation
        shell: bash -l {0}
        run: |
          python -c "import sys; print('Python:', sys.version)"
          python -c "import numpy; print('NumPy:', numpy.__version__)"
          python -c "from kuoeliassen import solve_ke; print('[OK] Module imported')"

      - name: Repair Windows DLL dependencies
        if: runner.os == 'Windows'
        shell: bash -l {0}
        run: |
          SITE_PACKAGES=$(python -c "import site; print(site.getsitepackages()[0])")
          if find "$SITE_PACKAGES" -name "*kuoeliassen_module*.pyd" 2>/dev/null | grep -q .; then
            find "$SITE_PACKAGES" -name "*kuoeliassen_module*.pyd" | while read pyd; do
              delvewheel repair "$pyd" -w "$(dirname "$pyd")"
            done
          fi
        continue-on-error: true

      - name: Run tests
        shell: bash -l {0}
        run: |
          python -c "from kuoeliassen import solve_ke; print('[OK] Module ready')"
          pytest tests/ -v --cov=kuoeliassen --cov-report=xml --cov-report=term-missing
        continue-on-error: false

      - name: Generate coverage report
        if: always()
        shell: bash -l {0}
        run: |
          if [ -f coverage.xml ]; then
            echo "coverage.xml exists"
          else
            coverage xml --fail-under=0 || echo "Failed to generate coverage.xml"
          fi
        continue-on-error: true

      - name: Upload coverage
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: kuoeliassen-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
