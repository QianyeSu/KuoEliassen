[build-system]
requires = ["meson-python", "numpy"]
build-backend = "mesonpy"

[project]
name = "KuoEliassen"
version = "0.1.0"
description = "High-Performance Kuo-Eliassen Circulation Solver"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24.0", "scipy>=1.7.0", "xarray>=0.19.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=src/kuoeliassen", "--cov-report=term-missing"]
