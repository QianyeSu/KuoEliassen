[build-system]
requires = ["meson-python>=0.15.0", "numpy>=1.21.0", "ninja"]
build-backend = "mesonpy"

[project]
name = "KuoEliassen"
version = "0.1.0"
description = "High-Performance Kuo-Eliassen Circulation Solver with Fortran Backend"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Qianye Su", email = "suqianye2000@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.24.0", "scipy>=1.7.0", "xarray>=0.19.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=3.0"]
docs = ["sphinx>=4.0", "sphinx-rtd-theme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["kuoeliassen"]
omit = ["*/tests/*"]
